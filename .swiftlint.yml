# SwiftLint configuration. Put this file in the root of your repo.
# Full rule list: https://realm.github.io/SwiftLint/rule-directory.html

# Folders SwiftLint should not check
excluded:
  - DerivedData
  - .build
  - Pods

# Extra rules that are off by default but worth having
opt_in_rules:
  - empty_count            # use isEmpty instead of count == 0
  - first_where            # use first(where:) instead of filter().first
  - force_unwrapping       # warn on "!" force unwraps
  - closure_spacing
  - sorted_imports
  - unused_import

# Relax a few defaults that are too strict for SwiftUI code
line_length:
  warning: 140
  error: 200

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000

identifier_name:
  excluded:
    - id
    - x
    - y
    - uv
